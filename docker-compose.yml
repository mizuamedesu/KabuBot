services:
  codex-runner:
    build:
      context: .
      dockerfile: runner/Dockerfile
    restart: unless-stopped
    environment:
      PORT: "8789"
      HOME: /home/codex
      CODEX_HOME: /home/codex/.codex
      WORKSPACE_DIR: /workspace
      KABUBOT_SKILLS_PATH: /workspace/skills
      CODEX_MODEL: ${CODEX_MODEL:-}
    volumes:
      - codex-state:/home/codex/.codex
      - ./:/workspace:ro

  monitor:
    build:
      context: .
      dockerfile: monitor/Dockerfile
    restart: unless-stopped
    depends_on:
      - codex-runner
    ports:
      - "127.0.0.1:8790:8790"
    environment:
      PORT: "8790"
      DATA_DIR: /app/data
      SECTOR_QUERY: ${SECTOR_QUERY:-ソフトウェア}
      MAX_CANDIDATES: ${MAX_CANDIDATES:-45}
      MARKET_TIMEZONE: ${MARKET_TIMEZONE:-America/New_York}
      MARKET_OPEN_SCAN_CRON: ${MARKET_OPEN_SCAN_CRON:-32 9 * * 1-5}
      RUN_ON_START: ${RUN_ON_START:-false}
      YFINANCE_THREADS: ${YFINANCE_THREADS:-true}
      XAI_API_KEY: ${XAI_API_KEY:-}
      GROK_MODEL: ${GROK_MODEL:-grok-3-mini}
      GROK_QUERY_DAYS: ${GROK_QUERY_DAYS:-2}
      CODEX_RUNNER_URL: http://codex-runner:8789
      CODEX_MODEL: ${CODEX_MODEL:-}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      DISCORD_ALLOWED_GUILD_ID: ${DISCORD_ALLOWED_GUILD_ID:-}
      DISCORD_ALLOWED_CHANNEL_ID: ${DISCORD_ALLOWED_CHANNEL_ID:-}
      DISCORD_ALLOWED_USER_IDS: ${DISCORD_ALLOWED_USER_IDS:-}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      REPORT_LANGUAGE: ${REPORT_LANGUAGE:-ja}
    volumes:
      - ./data:/app/data

volumes:
  codex-state:
